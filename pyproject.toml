[project]
name = "streamTest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "onnxruntime-training>=1.19.2",
    "onnxsim>=0.4.36",
    "pydot>=4.0.1",
    "scipy>=1.15.2",
    "stream-dse",
    "torch>=2.7.0",
    "onnxsim>=0.4.36",
    "uv",
    "transformers>=4.55.3",
    "optimum[onnx]>=1.27.0",
    "onnx==1.18.0",
    "pymoo>=0.6.1.5",
    "pulp>=3.3.0",
    "ipykernel>=6.29.5",
]

[tool.uv.sources]
stream-dse = { path = "stream", editable = true }

[dependency-groups]
visualize = [
    "netron>=8.2.9",
]
bonus = [
    "ipykernel>=6.29.5",
]

[tool.ruff]
target-version = "py311"
line-length = 120
fix = true
lint.select = ["E", "F", "W", "I", "PL", "N", "UP", "B"]
lint.ignore = ["D401", "N806"]
lint.pylint.max-args = 8
